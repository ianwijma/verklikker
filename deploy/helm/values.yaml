serviceImage: verklikker/service:0.1.0
workerImage: verklikker/worker:0.1.0
# Supply DATABASE_URL, WORKER_TOKEN, SESSION_SECRET, OIDC_ISSUER, OIDC_CLIENT_ID,
# PUBLIC_URL, S3_BUCKET, S3_ENDPOINT, S3_PUBLIC_ENDPOINT and AWS credentials.
existingSecret: verklikker
apiReplicas: 2
worker:
  maxReplicas: 200
  architecture: x64
  nodeArchitecture: amd64
  kvmGroup: 109
  nodeSelector: {verklikker.io/executor: "true"}
  # This pool accepts only jobs fitting these limits. Deploy a separate pool for larger jobs.
  cpus: 2
  memoryMiB: 4096
  diskBytes: 21474836480
  evidenceBytes: 10737418240
  resources:
    requests: {cpu: "3", memory: 6Gi, ephemeral-storage: 40Gi}
    limits: {cpu: "3", memory: 6Gi, ephemeral-storage: 40Gi, squat.ai/kvm: "1"}
# KVM resource must be supplied by an administrator-installed device plugin.
# Do not grant privileged mode or mount Docker sockets to workers.
