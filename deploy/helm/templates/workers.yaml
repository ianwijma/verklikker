apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  secretTargetRef:
    - {parameter: connection, name: "{{ .Values.existingSecret }}", key: DATABASE_URL}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: {{ .Release.Name }}-workers
spec:
  pollingInterval: 5
  maxReplicaCount: {{ .Values.worker.maxReplicas }}
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 10
  scalingStrategy: {strategy: accurate}
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 0
    activeDeadlineSeconds: 4500
    template:
      metadata: {labels: {app: "{{ .Release.Name }}-worker"}}
      spec:
        restartPolicy: Never
        automountServiceAccountToken: false
        terminationGracePeriodSeconds: 30
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          runAsNonRoot: true
          supplementalGroups: [{{ .Values.worker.kvmGroup }}]
        nodeSelector:
          kubernetes.io/arch: {{ .Values.worker.nodeArchitecture }}
          {{- toYaml .Values.worker.nodeSelector | nindent 10 }}
        containers:
          - name: executor
            image: {{ .Values.workerImage | quote }}
            env:
              - {name: API_URL, value: "http://{{ .Release.Name }}-api:3000"}
              - {name: WORKER_TOKEN, valueFrom: {secretKeyRef: {name: "{{ .Values.existingSecret }}", key: WORKER_TOKEN}}}
              - {name: S3_PUBLIC_ENDPOINT, valueFrom: {secretKeyRef: {name: "{{ .Values.existingSecret }}", key: S3_PUBLIC_ENDPOINT}}}
              - {name: WORKER_ONCE, value: "1"}
              - {name: WORKER_CPUS, value: "{{ .Values.worker.cpus }}"}
              - {name: WORKER_MEMORY_MIB, value: "{{ .Values.worker.memoryMiB }}"}
              - {name: WORKER_DISK_BYTES, value: "{{ .Values.worker.diskBytes }}"}
              - {name: WORKER_EVIDENCE_BYTES, value: "{{ .Values.worker.evidenceBytes }}"}
              - {name: EVIDENCE_DIRECTORY, value: /scratch/evidence}
              - {name: TMPDIR, value: /scratch/tmp}
            securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
            resources:
              {{- toYaml .Values.worker.resources | nindent 14 }}
            volumeMounts: [{name: scratch, mountPath: /scratch}, {name: tmp, mountPath: /tmp}]
        volumes: [{name: scratch, emptyDir: {sizeLimit: 38Gi}}, {name: tmp, emptyDir: {sizeLimit: 1Gi}}]
  triggers:
    - type: postgresql
      metadata:
        query: >-
          SELECT COALESCE(sum(LEAST(t.concurrency-t.active,q.n)),0) FROM tenants t CROSS JOIN LATERAL
          (SELECT count(*) n FROM runs r WHERE r.tenant_id=t.id AND r.state='queued'
          AND (r.spec->>'architecture' IS NULL OR r.spec->>'architecture'='{{ .Values.worker.architecture }}')
          AND (r.spec->'limits'->>'cpus')::int <= {{ .Values.worker.cpus }}
          AND (r.spec->'limits'->>'memoryMiB')::int <= {{ .Values.worker.memoryMiB }}
          AND (r.spec->'limits'->>'diskBytes')::bigint <= {{ .Values.worker.diskBytes }}
          AND (r.spec->'limits'->>'evidenceBytes')::bigint <= LEAST({{ .Values.worker.evidenceBytes }},t.storage_limit-t.storage_used-t.storage_reserved)) q
          WHERE t.active<t.concurrency
        targetQueryValue: "1"
      authenticationRef: {name: "{{ .Release.Name }}-postgres"}
