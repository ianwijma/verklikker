name: Check
on: [push, pull_request]
jobs:
  service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          {
            POSTGRES_USER: verklikker,
            POSTGRES_DB: verklikker,
            POSTGRES_PASSWORD: integration-only,
          }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U verklikker" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:integration
        env:
          {
            TEST_DATABASE_URL: "postgres://verklikker:integration-only@127.0.0.1:5432/verklikker",
          }
      - run: npm run build
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.9" }
      - run: bash scripts/build-gateway.sh
      - run: bash scripts/test-gateway.sh
